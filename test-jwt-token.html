<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT Token测试</title>
</head>
<body>
    <h1>JWT Token测试</h1>
    <button onclick="testLogin()">测试登录</button>
    <button onclick="testHistoryWithToken()">使用Token测试历史对话</button>
    <div id="result"></div>

    <script>
        let testToken = null;

        async function testLogin() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '测试登录...';
            
            try {
                // 先尝试注册用户
                const registerResponse = await fetch('http://localhost:9988/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: 'testuser',
                        email: 'test@example.com',
                        password: 'testpass',
                        nickname: 'Test User'
                    })
                });
                
                console.log('Register response:', registerResponse.status);
                
                // 然后尝试登录
                const response = await fetch('http://localhost:9988/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: 'testuser',
                        password: 'testpass'
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    testToken = data.token;
                    resultDiv.innerHTML = `
                        <p>✅ 登录成功</p>
                        <p>Token: ${testToken ? '已获取' : '未获取'}</p>
                        <p>用户: ${JSON.stringify(data.user)}</p>
                    `;
                } else {
                    const errorText = await response.text();
                    resultDiv.innerHTML = `
                        <p>❌ 登录失败</p>
                        <p>状态码: ${response.status}</p>
                        <p>错误: ${errorText}</p>
                        <p>注册状态: ${registerResponse.status}</p>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <p>❌ 登录错误: ${error.message}</p>
                `;
            }
        }

        async function testHistoryWithToken() {
            if (!testToken) {
                document.getElementById('result').innerHTML = '<p>请先登录获取Token</p>';
                return;
            }

            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '使用Token测试历史对话...';
            
            try {
                const response = await fetch('http://localhost:9988/api/chat-history', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${testToken}`
                    }
                });
                
                resultDiv.innerHTML = `
                    <p>历史对话API状态码: ${response.status}</p>
                    <p>状态文本: ${response.statusText}</p>
                `;
                
                if (response.ok) {
                    const histories = await response.json();
                    resultDiv.innerHTML += `<p>历史对话数量: ${histories.length}</p>`;
                    resultDiv.innerHTML += `<p>历史对话: ${JSON.stringify(histories)}</p>`;
                } else {
                    const errorText = await response.text();
                    resultDiv.innerHTML += `<p>错误响应: ${errorText}</p>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <p>❌ 历史对话API错误: ${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
