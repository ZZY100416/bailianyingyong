<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史对话API测试</title>
</head>
<body>
    <h1>历史对话API测试</h1>
    <button onclick="testHistoryAPI()">测试历史对话API</button>
    <button onclick="testSaveAPI()">测试保存对话API</button>
    <div id="result"></div>

    <script>
        async function testHistoryAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '测试历史对话API...';
            
            try {
                const response = await fetch('http://localhost:9988/api/chat-history', {
                    method: 'GET',
                    headers: {
                        'Authorization': 'Bearer test-token'
                    }
                });
                
                resultDiv.innerHTML = `
                    <p>状态码: ${response.status}</p>
                    <p>状态文本: ${response.statusText}</p>
                    <p>后端是否运行: ${response.status !== 0 ? '是' : '否'}</p>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <p>错误: ${error.message}</p>
                    <p>后端可能没有运行</p>
                `;
            }
        }

        async function testSaveAPI() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '测试保存对话API...';
            
            try {
                const response = await fetch('http://localhost:9988/api/chat-history', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer test-token'
                    },
                    body: JSON.stringify({
                        title: '测试对话',
                        messages: [
                            { role: 'user', content: '你好' },
                            { role: 'assistant', content: '你好！我是AI助手' }
                        ]
                    })
                });
                
                resultDiv.innerHTML = `
                    <p>保存API状态码: ${response.status}</p>
                    <p>状态文本: ${response.statusText}</p>
                `;
            } catch (error) {
                resultDiv.innerHTML = `
                    <p>保存API错误: ${error.message}</p>
                `;
            }
        }
    </script>
</body>
</html>
